<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Overscape app icon: a parent folder card with two child cards on the canvas. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1FB"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <path id="folder" d="M0,6 a6,6 0 0 1 6,-6 h10 l6,6 h16 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-32 a6,6 0 0 1 -6,-6 z"/>

    <!-- A row for a subfolder that has an open child card. -->
    <g id="folderRow">
      <rect x="14" y="-24" width="232" height="48" rx="12" fill="#DFEBFF"/>
      <use xlink:href="#folder" transform="translate(28,-11) scale(0.64)" fill="#2F7CF6"/>
      <rect x="70" y="-7" width="130" height="14" rx="7" fill="#2F7CF6" fill-opacity="0.75"/>
    </g>
    <!-- A row for a file. -->
    <g id="fileRow">
      <rect x="32" y="-13" width="20" height="26" rx="5" fill="#C3C9DD"/>
      <rect x="70" y="-7" width="110" height="14" rx="7" fill="#D5DAEA"/>
    </g>
    <!-- The header of a card: folder icon, name and separator line. -->
    <g id="header">
      <use xlink:href="#folder" transform="translate(26,24)" fill="#2F7CF6"/>
      <rect x="84" y="32" width="104" height="18" rx="9" fill="#2B2F55" fill-opacity="0.8"/>
    </g>
  </defs>

  <!-- Background -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#2F7CF6" filter="url(#iconShadow)"/>

  <!-- Connector lines -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <path d="M440,455 C524,455 516,255 600,255"/>
    <path d="M440,583 C524,583 516,629 600,629"/>
  </g>

  <!-- Parent card -->
  <g transform="translate(180,337)">
    <rect width="260" height="350" rx="34" fill="url(#card)" filter="url(#cardShadow)"/>
    <use xlink:href="#header"/>
    <rect x="0" y="77" width="260" height="2" fill="#E3E7F3"/>
    <use xlink:href="#folderRow" y="118"/>
    <use xlink:href="#fileRow" y="182"/>
    <use xlink:href="#folderRow" y="246"/>
    <use xlink:href="#fileRow" y="310"/>
  </g>

  <!-- Child cards -->
  <g transform="translate(600,214)">
    <rect width="240" height="222" rx="34" fill="url(#card)" filter="url(#cardShadow)"/>
    <use xlink:href="#header"/>
    <rect x="0" y="77" width="240" height="2" fill="#E3E7F3"/>
    <use xlink:href="#fileRow" y="118"/>
    <use xlink:href="#fileRow" y="182"/>
  </g>
  <g transform="translate(600,588)">
    <rect width="240" height="222" rx="34" fill="url(#card)" filter="url(#cardShadow)"/>
    <use xlink:href="#header"/>
    <rect x="0" y="77" width="240" height="2" fill="#E3E7F3"/>
    <use xlink:href="#fileRow" y="118"/>
    <use xlink:href="#fileRow" y="182"/>
  </g>

  <!-- Connector end points -->
  <g fill="#FFFFFF" stroke="#2F7CF6" stroke-width="7">
    <circle cx="440" cy="455" r="12"/>
    <circle cx="600" cy="255" r="12"/>
    <circle cx="440" cy="583" r="12"/>
    <circle cx="600" cy="629" r="12"/>
  </g>
</svg>
